        <p>
            <b>MD. SHAKIB AHMED</b><sup>[c]</sup> (born 11 May 2004) is a Bangladeshi student, AI engineer, and ethical hacker. He is currently pursuing a B.S.S. degree at <a href="#">Govt. Akbor Ali College</a>. He is widely known for his expertise in artificial intelligence, web development, and cybersecurity. Nicknamed <b>Ethan</b>,<sup>[D]</sup> he is active in the technology sector and has developed numerous efficient websites.
        </p>
        
        <p>
            Beyond technology, Shakib is a passionate enthusiast of horror shows, Bhoot FM, and anime. He also works as a cryptocurrency chart analyst. He was born and raised in <a href="#">Ullapara</a>, <a href="#">Sirajganj</a>, Bangladesh.
        </p>

        <h2>Early life and education</h2>
        <p>
            Shakib Ahmed was born on 11 May 2004 in <a href="#">Sirajganj</a>, Bangladesh. He completed his Secondary School Certificate (SSC) and later completed his Higher Secondary Certificate (HSC) in 2023 from <a href="#">H.T. Imam Degree College</a> (21/22 season). 
        </p>
        <p>
            Currently, he is studying for his B.S.S. degree at <a href="#">Govt. Akbor Ali College</a>. He began his early education with computer training, which sparked his interest in programming and technology.
        </p>

        <h2>Career and interests</h2>
        <p>
            Shakib Ahmed is a skilled programmer and AI specialist. He has worked on multiple web development projects and is self-described as an AI engineer. His main areas of interest include:
        </p>
        <ul>
            <li>Artificial Intelligence and machine learning</li>
            <li>Ethical hacking and cybersecurity</li>
            <li>Web development and programming</li>
            <li>Crypocurrency chart analysis</li>
        </ul>
        
        <p>
            He is also an avid fan of horror shows, <i>Bhoot FM</i>, and anime.
        </p>

        <h2>Personal motto</h2>
        <div class="quote">
            “Work hard silently and let your success make louder noise.”
        </div>

