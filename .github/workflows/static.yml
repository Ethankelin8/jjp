<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MD. SHAKIB AHMED - Wikipedia</title>
<style>
    /* === ORIGINAL WIKIPEDIA CSS VARIABLES === */
    :root {
        --color-base: #202122;
        --color-base-fixed: #202122;
        --color-emphasized: #000000;
        --color-subtle: #54595d;
        --color-progressive: #3366cc;
        --color-progressive--hover: #447ff5;
        --color-progressive--active: #2a4b8d;
        --color-destructive: #d73333;
        --color-success: #14866d;
        --color-border: #a2a9b1;
        --color-surface-0: #ffffff;
        --color-surface-1: #f8f9fa;
        --color-surface-2: #eaecf0;
        --color-surface-3: #c8ccd1;
        --font-family-serif: "Linux Libertine", "Georgia", "Times", serif;
        --font-family-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Lato, Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: var(--font-family-sans);
        background-color: var(--color-surface-0);
        color: var(--color-base);
        font-size: 16px;
        line-height: 1.6;
        overflow-x: hidden;
    }

    /* === LINKS === */
    a {
        color: var(--color-progressive);
        text-decoration: none;
    }
    a:visited { color: #6b4ba1; }
    a:active { background-color: var(--color-surface-2); }

    /* === HEADER (STICKY TOP) === */
    .minerva-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 54px;
        padding: 0 16px;
        background-color: var(--color-surface-0);
        border-bottom: 1px solid var(--color-surface-2);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-left, .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        cursor: pointer;
    }

    .icon-btn svg {
        width: 24px;
        height: 24px;
        fill: var(--color-subtle);
    }

    /* Wikipedia Wordmark Logo */
    .brand-logo {
        display: flex;
        align-items: center;
        margin-left: 8px;
    }
    .brand-logo svg {
        height: 20px;
        width: auto;
    }

    /* === PAGE TITLE === */
    .page-title-container {
        padding: 16px 16px 8px;
    }
    h1 {
        font-family: var(--font-family-serif);
        font-size: 32px;
        font-weight: normal;
        color: var(--color-emphasized);
        display: flex;
        align-items: center;
        gap: 6px;
        line-height: 1.2;
    }

    /* Verified Logo */
    .verified-icon {
        width: 22px;
        height: 22px;
    }

    /* === TABS (Article / Talk) === */
    .page-tabs {
        display: flex;
        padding: 0 16px;
        border-bottom: 1px solid var(--color-border);
        margin-top: 4px;
    }
    .tab {
        font-family: var(--font-family-sans);
        font-size: 14px;
        font-weight: bold;
        color: var(--color-subtle);
        padding: 10px 12px;
        cursor: pointer;
        position: relative;
    }
    .tab.active {
        color: var(--color-base);
    }
    .tab.active::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100%;
        height: 2px;
        background-color: var(--color-base);
    }

    /* === ACTION TOOLBAR (A/文, Bookmark, Edit, Download) === */
    .page-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 16px;
        border-bottom: 1px solid var(--color-surface-2);
    }
    .action-left {
        font-size: 15px;
        font-weight: bold;
        color: var(--color-subtle);
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: var(--font-family-serif);
    }
    .action-right {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    /* === HATNOTES === */
    .hatnote {
        padding: 12px 16px;
        background-color: var(--color-surface-1);
        border-bottom: 1px solid var(--color-surface-2);
        font-size: 14px;
        font-style: italic;
        color: var(--color-base);
    }
    .hatnote p { margin-bottom: 6px; }
    .hatnote p:last-child { margin-bottom: 0; }

    /* === MAIN CONTENT AREA === */
    .content {
        padding: 16px;
    }
    .content p {
        margin-bottom: 16px;
        font-size: 16px;
        color: var(--color-base);
    }
    .content b { font-weight: 700; }
    .content sup {
        font-size: 11px;
        color: var(--color-progressive);
        cursor: pointer;
    }
    
    /* === INFOBOX === */
    .infobox {
        width: 100%;
        background-color: var(--color-surface-1);
        border: 1px solid var(--color-border);
        border-collapse: collapse;
        margin-bottom: 24px;
        font-size: 14.5px;
    }
    .infobox th, .infobox td {
        padding: 10px 12px;
        vertical-align: top;
        border-top: 1px solid var(--color-surface-2);
        line-height: 1.4;
        text-align: left;
    }
    .infobox th {
        width: 35%;
        font-weight: bold;
        color: var(--color-base);
    }
    .infobox .title-row {
        background-color: #d9d3c3; /* Original Wikipedia Infobox Header Color */
        text-align: center;
        font-family: var(--font-family-serif);
        font-size: 18px;
        font-weight: bold;
        padding: 12px;
        border-top: none;
    }
    .infobox .image-row {
        text-align: center;
        padding: 12px;
        background-color: var(--color-surface-0);
    }
    .infobox .image-row img {
        width: 180px;
        max-width: 100%;
        height: auto;
        border: 1px solid var(--color-surface-3);
    }
    .infobox .caption {
        font-size: 13px;
        color: var(--color-subtle);
        margin-top: 8px;
        text-align: left;
    }

    /* Social Icons in Infobox */
    .social-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 12px;
        border-top: 1px solid var(--color-surface-2);
        background-color: var(--color-surface-0);
    }
    .social-row a {
        display: inline-flex;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--color-surface-3);
        background-color: var(--color-surface-0);
    }
    .social-row a:active { background-color: var(--color-surface-2); }
    .social-row svg { width: 20px; height: 20px; }

    /* === HEADINGS === */
    h2 {
        font-family: var(--font-family-serif);
        font-size: 24px;
        font-weight: normal;
        color: var(--color-emphasized);
        border-bottom: 1px solid var(--color-border);
        padding-bottom: 4px;
        margin: 28px 0 16px;
    }

    ul {
        margin: 0 0 16px 24px;
        font-size: 16px;
    }
    li { margin-bottom: 6px; }

    /* Quote Box */
    .quote {
        border-left: 3px solid var(--color-progressive);
        background-color: #eaf3ff;
        padding: 12px 16px;
        font-style: italic;
        margin: 16px 0;
        font-size: 15px;
        color: var(--color-base);
    }

</style>
</head>
